---
- name: Install Apache Web Server
  hosts: webservers
  become: yes

  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Start Apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create home page
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Ansible Web Server Installed Successfully</h1>
